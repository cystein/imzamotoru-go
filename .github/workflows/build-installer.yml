name: Kolitakip Asistan (KolitakipIMZA) Installer Üret

on:
  workflow_dispatch:

jobs:
  # 1. Adım (v2.0.0'dan beri): exe burada DERLENMİYOR. release.sh'in GitHub Release'e yüklediği,
  #    ECDSA ile imzalanmış KolitakipIMZA.exe.gz indirilir ve sunucudaki latest.json'daki sha256 ile
  #    karşılaştırılır. Böylece Setup.exe ile otomatik güncelleme BAYT BAYT aynı exe'yi taşır ve
  #    bağlantı testi HMAC anahtarı yalnız yayın bilgisayarında kalır (GitHub secret'ı gerekmez).
  #    Önce ./release.sh çalıştırılmış olmalı.
  build-exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Yayınlanmış exe'yi indir ve doğrula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*APP_VERSION = "\(.*\)".*/\1/p' version.go)
          TAG="v$VERSION"
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern KolitakipIMZA.exe.gz --clobber
          gunzip -f KolitakipIMZA.exe.gz
          # Aşamalı yayında (ADAY=1 ./release.sh) imzalı bilgiler latest-aday.json'da durur.
          LATEST=$(curl -fsS https://eimza.sgkkolitakip.web.tr/imza-motoru/latest.json)
          if [ "$(echo "$LATEST" | python3 -c 'import sys,json; print(json.load(sys.stdin)["version"])')" != "$VERSION" ]; then
            LATEST=$(curl -fsS https://eimza.sgkkolitakip.web.tr/imza-motoru/latest-aday.json)
          fi
          BEKLENEN_SURUM=$(echo "$LATEST" | python3 -c 'import sys,json; print(json.load(sys.stdin)["version"])')
          BEKLENEN_SHA=$(echo "$LATEST" | python3 -c 'import sys,json; print(json.load(sys.stdin)["sha256"])')
          GERCEK_SHA=$(sha256sum KolitakipIMZA.exe | cut -d' ' -f1)
          echo "version.go=$VERSION latest.json=$BEKLENEN_SURUM"
          echo "sha256 beklenen=$BEKLENEN_SHA gerçek=$GERCEK_SHA"
          if [ "$BEKLENEN_SURUM" != "$VERSION" ] || [ "$BEKLENEN_SHA" != "$GERCEK_SHA" ]; then
            echo "::error::Release exe'si latest.json ile eşleşmiyor — önce ./release.sh çalıştırın"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: KolitakipIMZA-exe
          path: KolitakipIMZA.exe

  # 2. Adım: SADECE burası gerçek Windows istiyor — Inno Setup Compiler (ISCC.exe) Windows'a
  #    özgü bir araç, Linux portu yok.
  build-installer:
    needs: build-exe
    runs-on: windows-latest
    # GITHUB_TOKEN ile Release oluşturabilmek için (repo varsayılanı salt-okunur olabiliyor).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: KolitakipIMZA-exe
          path: .

      - name: Inno Setup kur
        run: choco install innosetup -y

      - name: Installer derle
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\KolitakipIMZA.iss

      - uses: actions/upload-artifact@v4
        with:
          name: KolitakipIMZA-Setup
          path: installer/output/KolitakipIMZA-Setup.exe

      # 3. Adım: Installer'ı sunucumuz yerine GitHub Releases üzerinden dağıtıyoruz —
      # GitHub'ın kendi CDN'i bizim sunucumuzdan çok daha hızlı ve upload bant genişliğimizi
      # (indirmeler bizim üzerimizden değil GitHub'ın üzerinden gittiği için) hiç yormuyor.
      # Sürüm etiketi version.go'daki APP_VERSION'dan okunuyor; aynı sürüm için workflow
      # tekrar çalıştırılırsa (release zaten varsa) release oluşturmak yerine dosyayı üzerine
      # yazıyoruz (idempotent). Varlık adı hep "KolitakipIMZA-Setup.exe" kalıyor ki
      # ".../releases/latest/download/KolitakipIMZA-Setup.exe" linki hangi sürüm olursa olsun
      # her zaman çalışsın — istemci tarafında versiyon numarasını güncellemeye gerek kalmıyor.
      - name: Sürümü oku
        id: surum
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*APP_VERSION = "\(.*\)".*/\1/p' version.go)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: GitHub Release'e installer'ı yükle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.surum.outputs.version }}"
          REPO="${{ github.repository }}"
          ASSET="installer/output/KolitakipIMZA-Setup.exe"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --repo "$REPO" --clobber
          else
            gh release create "$TAG" "$ASSET" --repo "$REPO" \
              --title "Kolitakip Asistan $TAG" --notes "Otomatik CI derlemesi."
          fi
