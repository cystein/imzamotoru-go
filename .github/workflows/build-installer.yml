name: KolitakipIMZA Installer Üret

on:
  workflow_dispatch:

jobs:
  # 1. Adım: Windows exe'yi burada, Ubuntu üzerinde mingw-w64 ile cross-compile ediyoruz —
  #    aynı kanıtlanmış tarif (build_windows.sh), Windows makinesine hiç gerek yok.
  build-exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: mingw-w64 kur
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: İkon kaynağını (rsrc) üret
        run: |
          go install github.com/akavel/rsrc@latest
          "$(go env GOPATH)/bin/rsrc" -ico assets/icon.ico -o rsrc_windows_amd64.syso

      - name: Windows exe derle
        run: |
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 CC=x86_64-w64-mingw32-gcc \
            go build -ldflags "-H=windowsgui" -o KolitakipIMZA.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: KolitakipIMZA-exe
          path: KolitakipIMZA.exe

  # 2. Adım: SADECE burası gerçek Windows istiyor — Inno Setup Compiler (ISCC.exe) Windows'a
  #    özgü bir araç, Linux portu yok.
  build-installer:
    needs: build-exe
    runs-on: windows-latest
    # GITHUB_TOKEN ile Release oluşturabilmek için (repo varsayılanı salt-okunur olabiliyor).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: KolitakipIMZA-exe
          path: .

      - name: Inno Setup kur
        run: choco install innosetup -y

      - name: Installer derle
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\KolitakipIMZA.iss

      - uses: actions/upload-artifact@v4
        with:
          name: KolitakipIMZA-Setup
          path: installer/output/KolitakipIMZA-Setup.exe

      # 3. Adım: Installer'ı sunucumuz yerine GitHub Releases üzerinden dağıtıyoruz —
      # GitHub'ın kendi CDN'i bizim sunucumuzdan çok daha hızlı ve upload bant genişliğimizi
      # (indirmeler bizim üzerimizden değil GitHub'ın üzerinden gittiği için) hiç yormuyor.
      # Sürüm etiketi version.go'daki APP_VERSION'dan okunuyor; aynı sürüm için workflow
      # tekrar çalıştırılırsa (release zaten varsa) release oluşturmak yerine dosyayı üzerine
      # yazıyoruz (idempotent). Varlık adı hep "KolitakipIMZA-Setup.exe" kalıyor ki
      # ".../releases/latest/download/KolitakipIMZA-Setup.exe" linki hangi sürüm olursa olsun
      # her zaman çalışsın — istemci tarafında versiyon numarasını güncellemeye gerek kalmıyor.
      - name: Sürümü oku
        id: surum
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*APP_VERSION = "\(.*\)".*/\1/p' version.go)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: GitHub Release'e installer'ı yükle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.surum.outputs.version }}"
          REPO="${{ github.repository }}"
          ASSET="installer/output/KolitakipIMZA-Setup.exe"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --repo "$REPO" --clobber
          else
            gh release create "$TAG" "$ASSET" --repo "$REPO" \
              --title "KolitakipIMZA $TAG" --notes "Otomatik CI derlemesi."
          fi
